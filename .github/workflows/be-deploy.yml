name: Publish NestJS images

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/pull-request-test.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Publish application
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            birdiehyun/yg-server:${{ github.sha }}
            birdiehyun/yg-server:latest
      - name: Publish matching Flyway migrations
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrations
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            birdiehyun/yg-server:flyway-${{ github.sha }}
            birdiehyun/yg-server:flyway-latest
  deploy:
    needs: publish
    # 수동 실행을 다른 브랜치에서 해도 운영에는 dev만 배포한다.
    if: github.ref == 'refs/heads/dev'
    uses: ./.github/workflows/deploy.yml
    with:
      sha: ${{ github.sha }}
    secrets: inherit
